<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>halflings</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #23262a;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* Pointer-lock hint. This slice has no game UI — it is the only
         element there is, and it disappears after the first click. */
      #hint {
        position: fixed;
        inset: auto 0 2rem 0;
        margin: 0;
        text-align: center;
        font: 13px/1.6 system-ui, sans-serif;
        color: #cdd3d8;
        text-shadow: 0 1px 3px #000;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      #hint[hidden] {
        display: block;
        opacity: 0;
      }
      /* Roughly four megabytes of models and clips load before the first
         frame. Without this the page is a flat dark rectangle for as long
         as that takes, which reads as broken rather than as loading. */
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 1rem;
        justify-items: center;
        background: #23262a;
        color: #cdd3d8;
        font: 14px/1.6 system-ui, sans-serif;
        transition: opacity 0.4s;
      }
      #loading[hidden] {
        display: grid;
        opacity: 0;
        pointer-events: none;
      }
      #loading .bar {
        width: 9rem;
        height: 2px;
        background: #33383d;
        overflow: hidden;
      }
      #loading .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: #7d9e55;
        animation: sweep 1.1s ease-in-out infinite;
      }
      @keyframes sweep {
        from { transform: translateX(-100%); }
        to { transform: translateX(350%); }
      }
      #loading.failed .bar {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <div id="loading"><p id="loading-text">loading the valley</p><div class="bar"></div></div>
    <p id="hint" hidden>click to capture the mouse · WASD to walk · Shift to run · space to jump · Esc to release · wheel to zoom</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
